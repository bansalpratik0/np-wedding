    <path d="M0 160 C60 90 76 36 83 0" fill="none" stroke="#5f935f" stroke-width="9"/>
    <path d="M43 156 C36 116 28 74 17 46" fill="none" stroke="#5f935f" stroke-width="7"/>
    <g fill="#f08aa1" stroke="#ffd0d9" stroke-width="3">
      <circle cx="79" cy="22" r="18"/><circle cx="54" cy="65" r="21"/><circle cx="31" cy="111" r="18"/><circle cx="87" cy="112" r="23"/><circle cx="50" cy="153" r="20"/>
    </g>
    <g fill="#f8bdcb">
      <circle cx="77" cy="16" r="8"/><circle cx="50" cy="60" r="9"/><circle cx="27" cy="106" r="8"/><circle cx="84" cy="107" r="10"/><circle cx="46" cy="148" r="9"/>
    </g>
    <g fill="#3f8a56">
      <path d="M7 153 q-42-18-39-53 q39 13 39 53Z"/>
      <path d="M55 156 q38-29 49 1 q-33 20-49-1Z"/>
